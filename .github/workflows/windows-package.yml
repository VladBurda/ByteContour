name: Windows package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.13 --group release
      - name: Verify version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = uv run --no-sync python -c "from importlib.metadata import version; print(version('bytecontour'))"
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw "Tag must match the package version" }
      - run: uv run --no-sync pytest
      - run: uv run --no-sync python scripts/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: ByteContour-windows-x64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
